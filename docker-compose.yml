services:
  olcrtc-manager:
    image: ghcr.io/bigdaddy3334/olcrtc-manager-panel:latest
    container_name: olcrtc-manager
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    environment:
      PANEL_ADDR: "${PANEL_ADDR:-0.0.0.0}"
      PANEL_PORT: "${PANEL_PORT:-}"
      PANEL_CERT_IP: "${PANEL_CERT_IP:-}"
    volumes:
      - ./data:/etc/olcrtc-manager
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

